<!doctype html>
<html lang="zh-tw">
    <head>
        <meta charset="UTF-8">
        <title>this is my first API learning work</title>
    </head>
    <body>
        <button id="loadBtn">載入使用者</button>
        <table border="1">
            <thead>
                <tr>
                    <th>名字</th>
                    <th>Email</th>    
            </tr>
            </thead>
            <tbody id="output">
            </tbody>
        </table>
        <script>
            document.querySelector("#loadBtn").onclick = async function () {
                const resource = await fetch("https://jsonplaceholder.typicode.com/users");
                const outcome = await resource.json();
                const output = outcome.map(user => `<tr><td>${user.name}</td><td>${user.email}</td></tr>`  ).join("")
                 document.querySelector("#output").innerHTML = output 
            }   
        </script>
    </body>
</html>
